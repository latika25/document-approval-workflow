services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: document_approval
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d document_approval"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://app:app@db:5432/document_approval
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me}
    volumes:
      - uploads:/app/data
    depends_on:
      db:
        condition: service_healthy

  pgweb:
    image: sosedoff/pgweb:latest
    ports:
      - "8081:8081"
    environment:
      PGWEB_DATABASE_URL: postgres://app:app@db:5432/document_approval?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
